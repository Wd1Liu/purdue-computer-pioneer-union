<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Automate the loop, protect the test</title><desc id="desc">Research loop with an editorially proposed independent holdout.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="800" rx="20" fill="#20231f"/><text x="56" y="58" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">01 / RESEARCH MECHANISM</text><text x="56" y="113" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Automate the loop, protect the test</text><text x="56" y="151" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A hypothesis earns evidence only after it becomes an executable experiment.</text><rect x="56" y="210" width="315" height="157" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="79" y="244" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">01</text><text x="79" y="286" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Hypothesis</text><text x="79" y="322" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Choose a factor or model</text><text x="79" y="351" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">change.</text><rect x="432" y="210" width="315" height="157" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="455" y="244" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">02</text><text x="455" y="286" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Implementation</text><text x="455" y="322" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Generate and validate</text><text x="455" y="351" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">code.</text><rect x="432" y="433" width="315" height="157" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="455" y="467" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">03</text><text x="455" y="509" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Backtest + analysis</text><text x="455" y="545" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Execute, inspect, record</text><text x="455" y="574" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">feedback.</text><rect x="56" y="433" width="315" height="157" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="79" y="467" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">04</text><text x="79" y="509" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Schedule next step</text><text x="79" y="545" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Revisit factors or revise</text><text x="79" y="574" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">the model.</text><line x1="380" y1="286" x2="419" y2="286" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="588" y1="378" x2="588" y2="421" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="420" y1="511" x2="383" y2="511" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="213" y1="421" x2="213" y2="380" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="786" y1="208" x2="786" y2="651" stroke="#484d43" stroke-width="2" stroke-dasharray="6 9"/><rect x="825" y="210" width="319" height="380" rx="14" fill="#30362b" stroke="#d7ad57" stroke-width="2" stroke-dasharray="7 6"/><circle cx="873" cy="262" r="18" fill="#d7ad57"/><text x="905" y="270" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">FINAL HOLDOUT</text><text x="851" y="326" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">Keep final evidence</text><text x="851" y="365" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">outside the search</text><text x="851" y="404" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" text-anchor="start" letter-spacing="0">loop.</text><text x="851" y="469" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Our proposed safeguard:</text><text x="851" y="500" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">unlock only after</text><text x="851" y="531" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">freezing the experiment</text><text x="851" y="562" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">plan.</text><text x="56" y="652" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Persist the hypothesis, code, failures, configuration, and result.</text><line x1="56" y1="716" x2="1144" y2="716" stroke="#abae9f" stroke-width="1"/><text x="56" y="753" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Conceptual diagram • PCPU</text><text x="56" y="780" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Paper-inspired loop; the locked final test is a PCPU replication proposal.</text></svg>