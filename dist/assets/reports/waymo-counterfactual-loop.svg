<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">A different action needs a different world</title><desc id="desc">Conceptual closed-loop simulation and a separate validation layer.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="810" rx="20" fill="#20231f"/><text x="56" y="58" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">01 / COUNTERFACTUAL MECHANISM</text><text x="56" y="113" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">A different action needs a different world</text><text x="56" y="151" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Generated observations must respond to what the driving policy does.</text><rect x="56" y="214" width="298" height="158" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="79" y="266" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Driving policy</text><text x="79" y="313" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Choose a next action</text><rect x="451" y="214" width="298" height="158" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="474" y="266" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">World model</text><text x="474" y="313" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Update the simulated</text><text x="474" y="344" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">scene</text><rect x="846" y="214" width="298" height="158" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="869" y="266" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Sensor outputs</text><text x="869" y="313" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Camera views + lidar</text><line x1="365" y1="292" x2="438" y2="292" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="760" y1="292" x2="832" y2="292" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><path d="M 995 383 L 995 432 L 205 432 L 205 385" fill="none" stroke="#d7ad57" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="471" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0">New observations inform the next action</text><rect x="56" y="524" width="1088" height="142" rx="14" fill="#343a2e"/><text x="82" y="565" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="1.4">A SEPARATE VALIDATION QUESTION</text><text x="82" y="610" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Does it look right?</text><text x="458" y="610" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Does it react right?</text><text x="845" y="610" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Does it transfer?</text><text x="82" y="641" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Visual consistency</text><text x="458" y="641" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Action consequences</text><text x="845" y="641" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Independent evidence</text><line x1="56" y1="726" x2="1144" y2="726" stroke="#abae9f" stroke-width="1"/><text x="56" y="763" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Conceptual diagram • PCPU</text><text x="56" y="790" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Schematic mechanism, not a performance result or a real-world safety claim.</text></svg>