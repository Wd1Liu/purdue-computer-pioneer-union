<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Realism is only the first layer</title><desc id="desc">Qualitative editorial evidence matrix, not a quantitative ranking.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="820" rx="20" fill="#f4f0e5"/><text x="56" y="58" fill="#805b19" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">02 / EVIDENCE AND LIMITS</text><text x="56" y="113" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Realism is only the first layer</text><text x="56" y="151" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A proposed checklist for interrogating a generated driving world.</text><rect x="56" y="208" width="290" height="62" rx="0" fill="#20231f"/><text x="74" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Validation layer</text><rect x="346" y="208" width="397" height="62" rx="0" fill="#20231f"/><text x="364" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Question to ask</text><rect x="743" y="208" width="401" height="62" rx="0" fill="#20231f"/><text x="761" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Why it matters</text><rect x="56" y="270" width="290" height="114" rx="0" fill="#e8e4d7"/><text x="74" y="307" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Visual realism</text><rect x="346" y="270" width="397" height="114" rx="0" fill="#e8e4d7"/><text x="364" y="307" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Does the scene remain</text><text x="364" y="337" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">coherent?</text><rect x="743" y="270" width="401" height="114" rx="0" fill="#e8e4d7"/><text x="761" y="307" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Plausibility is necessary,</text><text x="761" y="337" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">not sufficient.</text><rect x="56" y="384" width="290" height="114" rx="0" fill="#efecdf"/><text x="74" y="421" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Sensor agreement</text><rect x="346" y="384" width="397" height="114" rx="0" fill="#efecdf"/><text x="364" y="421" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Do camera and lidar describe</text><text x="364" y="451" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">the same scene?</text><rect x="743" y="384" width="401" height="114" rx="0" fill="#efecdf"/><text x="761" y="421" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Conflicting inputs can</text><text x="761" y="451" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">distort evaluation.</text><rect x="56" y="498" width="290" height="114" rx="0" fill="#e8e4d7"/><text x="74" y="535" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Action response</text><rect x="346" y="498" width="397" height="114" rx="0" fill="#e8e4d7"/><text x="364" y="535" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Do other road users react</text><text x="364" y="565" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">plausibly?</text><rect x="743" y="498" width="401" height="114" rx="0" fill="#e8e4d7"/><text x="761" y="535" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A decision changes future</text><text x="761" y="565" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">observations.</text><rect x="56" y="612" width="290" height="114" rx="0" fill="#efecdf"/><text x="74" y="649" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Real-world transfer</text><rect x="346" y="612" width="397" height="114" rx="0" fill="#efecdf"/><text x="364" y="649" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Does the failure survive</text><text x="364" y="679" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">independent checks?</text><rect x="743" y="612" width="401" height="114" rx="0" fill="#efecdf"/><text x="761" y="649" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Simulator artifacts must not</text><text x="761" y="679" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">decide safety.</text><line x1="56" y1="736" x2="1144" y2="736" stroke="#596052" stroke-width="1"/><text x="56" y="773" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-reading matrix • PCPU</text><text x="56" y="800" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Proposed qualitative checks, not measured scores or a safety certification.</text></svg>