<rect x="44" y="496" width="1110" height="168" rx="18" fill="#f5dfd5"/>
<text x="70" y="537" fill="#915638" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">THE SHORTCUT TO TEST</text>
<text x="70" y="581" fill="#17313c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" text-anchor="start" letter-spacing="0">Request → completed answer → submit</text>
<text x="70" y="623" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Task completion can rise without showing what the learner can now do alone.</text>
<text x="45" y="730" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">PCPU conceptual illustration • Not measured results</text>
<text x="1155" y="730" fill="#187b76" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="1">PCPU / RESEARCH NOTES</text>
</svg>