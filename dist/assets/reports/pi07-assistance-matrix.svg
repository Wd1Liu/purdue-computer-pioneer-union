<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Three claims, three scorecards</title><desc id="desc">Qualitative separation of assistance conditions.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="820" rx="20" fill="#f4f0e5"/><text x="56" y="58" fill="#805b19" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">02 / EVIDENCE AND LIMITS</text><text x="56" y="113" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Three claims, three scorecards</text><text x="56" y="151" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Count where the plan comes from before comparing task success.</text><rect x="56" y="215" width="336" height="444" rx="14" fill="#e7e3d6"/><rect x="56" y="215" width="336" height="58" rx="0" fill="#20231f"/><text x="76" y="252" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">ONE INSTRUCTION</text><text x="79" y="316" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Single-instruction</text><text x="79" y="416" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Robot receives the</text><text x="79" y="449" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">task, without step-by-</text><text x="79" y="482" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">step human guidance.</text><line x1="79" y1="526" x2="369" y2="526" stroke="#bdbbaa" stroke-width="1"/><text x="79" y="567" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Record retries, task</text><text x="79" y="598" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">stages, and completion.</text><rect x="432" y="215" width="336" height="444" rx="14" fill="#e7e3d6"/><rect x="432" y="215" width="336" height="58" rx="0" fill="#20231f"/><text x="452" y="252" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">HUMAN COACHING</text><text x="455" y="316" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Interactive</text><text x="455" y="353" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">execution</text><text x="455" y="416" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">A person supplies</text><text x="455" y="449" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">detailed substeps</text><text x="455" y="482" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">during the attempt.</text><line x1="455" y1="526" x2="745" y2="526" stroke="#bdbbaa" stroke-width="1"/><text x="455" y="567" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Record instructions,</text><text x="455" y="598" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">interventions, and time.</text><rect x="808" y="215" width="336" height="444" rx="14" fill="#e7e3d6"/><rect x="808" y="215" width="336" height="58" rx="0" fill="#20231f"/><text x="828" y="252" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1">AFTER ADAPTATION</text><text x="831" y="316" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Learned high-level</text><text x="831" y="353" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">plan</text><text x="831" y="416" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">A task-adapted policy</text><text x="831" y="449" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">generates the</text><text x="831" y="482" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">intermediate</text><text x="831" y="515" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">instructions.</text><line x1="831" y1="526" x2="1121" y2="526" stroke="#bdbbaa" stroke-width="1"/><text x="831" y="567" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Record adaptation data,</text><text x="831" y="598" fill="#5f4d29" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">then test new settings.</text><line x1="56" y1="736" x2="1144" y2="736" stroke="#596052" stroke-width="1"/><text x="56" y="773" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-reading matrix • PCPU</text><text x="56" y="800" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Different assistance conditions are not interchangeable. Checklist is a proposed evaluation design.</text></svg>