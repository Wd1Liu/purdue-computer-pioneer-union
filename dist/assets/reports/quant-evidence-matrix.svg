<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">What does each result establish?</title><desc id="desc">Qualitative editorial evidence matrix, not a quantitative ranking.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="820" rx="20" fill="#f4f0e5"/><text x="56" y="58" fill="#805b19" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">02 / EVIDENCE AND LIMITS</text><text x="56" y="113" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">What does each result establish?</text><text x="56" y="151" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Do not let “runs correctly” become “will work in the future”.</text><rect x="56" y="208" width="290" height="62" rx="0" fill="#20231f"/><text x="74" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Evidence layer</text><rect x="346" y="208" width="397" height="62" rx="0" fill="#20231f"/><text x="364" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Can support</text><rect x="743" y="208" width="401" height="62" rx="0" fill="#20231f"/><text x="761" y="248" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="0">Still needs a test</text><rect x="56" y="270" width="290" height="114" rx="0" fill="#e8e4d7"/><text x="74" y="307" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Executable code</text><rect x="346" y="270" width="397" height="114" rx="0" fill="#e8e4d7"/><text x="364" y="307" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">The idea can be implemented.</text><rect x="743" y="270" width="401" height="114" rx="0" fill="#e8e4d7"/><text x="761" y="307" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Whether the idea predicts</text><text x="761" y="337" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">anything.</text><rect x="56" y="384" width="290" height="114" rx="0" fill="#efecdf"/><text x="74" y="421" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Historical backtest</text><rect x="346" y="384" width="397" height="114" rx="0" fill="#efecdf"/><text x="364" y="421" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Performance under one</text><text x="364" y="451" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">protocol.</text><rect x="743" y="384" width="401" height="114" rx="0" fill="#efecdf"/><text x="761" y="421" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Sensitivity to search and</text><text x="761" y="451" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">costs.</text><rect x="56" y="498" width="290" height="114" rx="0" fill="#e8e4d7"/><text x="74" y="535" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Other markets</text><rect x="346" y="498" width="397" height="114" rx="0" fill="#e8e4d7"/><text x="364" y="535" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Breadth across tested</text><text x="364" y="565" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">settings.</text><rect x="743" y="498" width="401" height="114" rx="0" fill="#e8e4d7"/><text x="761" y="535" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Durability in new conditions.</text><rect x="56" y="612" width="290" height="114" rx="0" fill="#efecdf"/><text x="74" y="649" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Fresh final period</text><rect x="346" y="612" width="397" height="114" rx="0" fill="#efecdf"/><text x="364" y="649" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A new out-of-sample check.</text><rect x="743" y="612" width="401" height="114" rx="0" fill="#efecdf"/><text x="761" y="649" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Persistence beyond that</text><text x="761" y="679" fill="#4d5647" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">period.</text><line x1="56" y1="736" x2="1144" y2="736" stroke="#596052" stroke-width="1"/><text x="56" y="773" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Evidence-reading matrix • PCPU</text><text x="56" y="800" fill="#596052" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Qualitative editorial distinctions. No score or future return is implied.</text></svg>