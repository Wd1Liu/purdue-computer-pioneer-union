<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Keep different resources busy</title><desc id="desc">Conceptual attention stages and a non-timed two-tile pipeline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="800" rx="20" fill="#20231f"/><text x="56" y="58" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">01 / KERNEL MECHANISM</text><text x="56" y="113" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Keep different resources busy</text><text x="56" y="151" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Attention is more than a matrix multiplication.</text><rect x="56" y="198" width="300" height="124" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="80" y="239" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Compare tokens</text><text x="80" y="286" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Q × Kᵀ → scores</text><rect x="450" y="198" width="300" height="124" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="474" y="239" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Normalize scores</text><text x="474" y="286" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Softmax → weights</text><rect x="844" y="198" width="300" height="124" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="868" y="239" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">Mix values</text><text x="868" y="286" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Weights × V → output</text><line x1="367" y1="258" x2="435" y2="258" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><line x1="761" y1="258" x2="829" y2="258" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><text x="56" y="383" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="1.7">TWO TILES, OVERLAPPING JOBS</text><text x="56" y="445" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Tile A</text><text x="56" y="530" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">Tile B</text><rect x="205" y="409" width="190" height="59" rx="14" fill="#d7ad57"/><text x="300.0" y="447" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Compare</text><rect x="415" y="409" width="190" height="59" rx="14" fill="#849678"/><text x="510.0" y="447" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Softmax</text><rect x="625" y="409" width="190" height="59" rx="14" fill="#d7ad57"/><text x="720.0" y="447" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Mix values</text><rect x="415" y="494" width="190" height="59" rx="14" fill="#d7ad57"/><text x="510.0" y="532" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Compare</text><rect x="625" y="494" width="190" height="59" rx="14" fill="#849678"/><text x="720.0" y="532" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Softmax</text><rect x="835" y="494" width="190" height="59" rx="14" fill="#d7ad57"/><text x="930.0" y="532" fill="#20231f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Mix values</text><rect x="56" y="594" width="1088" height="82" rx="14" fill="#363b31"/><text x="80" y="627" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Less waiting, less traffic</text><text x="80" y="657" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">Specialized thread groups • tensor-memory intermediates • coordinated correction</text><line x1="56" y1="716" x2="1144" y2="716" stroke="#abae9f" stroke-width="1"/><text x="56" y="753" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Conceptual diagram • PCPU</text><text x="56" y="780" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Schematic overlap only; stages and widths are not an execution trace.</text></svg>