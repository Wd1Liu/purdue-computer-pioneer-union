<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">A failure map, not a highlight reel</title><desc id="desc">Proposed stress tests separate what a good-looking overlay can hide.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#187b76" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="860" rx="28" fill="#f6f4ed"/>
