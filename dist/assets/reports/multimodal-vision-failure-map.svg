<text x="405" y="250" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">FAILURE TO RECORD</text>
<rect x="752" y="218" width="404" height="50" rx="12" fill="#17313c"/>
<text x="770" y="250" fill="#fffefa" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="0">QUESTION TO ASK</text>
<rect x="44" y="285" width="1112" height="99" rx="14" fill="#fffefa"/>
<rect x="44" y="285" width="7" height="99" rx="3" fill="#f5dfd5"/>
<text x="63" y="343" fill="#17313c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">No target present</text>
<text x="406" y="343" fill="#17313c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">False positive</text>
<text x="772" y="324" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Can the output</text>
<text x="772" y="355" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">correctly stay empty?</text>
<rect x="44" y="396" width="1112" height="99" rx="14" fill="#fffefa"/>
<rect x="44" y="396" width="7" height="99" rx="3" fill="#dde9f2"/>
<text x="63" y="454" fill="#17313c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Near-matching objects</text>
<text x="406" y="454" fill="#17313c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">Wrong inclusion</text>
<text x="772" y="435" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Does the phrase</text>
<text x="772" y="466" fill="#5c7078" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">exclude distractors?</text>
