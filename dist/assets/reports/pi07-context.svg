<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">Tell the robot how, not only what</title><desc id="desc">Conceptual context-conditioning design for pi0.7.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d7ad57"/></marker></defs><rect width="1200" height="800" rx="20" fill="#20231f"/><text x="56" y="58" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="start" letter-spacing="2">01 / ROBOT MECHANISM</text><text x="56" y="113" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" text-anchor="start" letter-spacing="0">Tell the robot how, not only what</text><text x="56" y="151" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Context selects a strategy; observations keep actions grounded.</text><rect x="56" y="205" width="336" height="115" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="78" y="245" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Language</text><text x="78" y="289" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Task + next subtask</text><rect x="432" y="205" width="336" height="115" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="454" y="245" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Visual subgoal</text><text x="454" y="289" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">A desired intermediate state</text><rect x="808" y="205" width="336" height="115" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="830" y="245" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">Metadata</text><text x="830" y="289" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Quality, speed, control mode</text><path d="M 224 329 L 224 364 L 600 364" fill="none" stroke="#d7ad57" stroke-width="2"/><path d="M 600 329 L 600 364 L 600 364" fill="none" stroke="#d7ad57" stroke-width="2"/><path d="M 976 329 L 976 364 L 600 364" fill="none" stroke="#d7ad57" stroke-width="2"/><line x1="600" y1="364" x2="600" y2="395" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><rect x="365" y="407" width="470" height="113" rx="14" fill="#3c4534" stroke="#d7ad57" stroke-width="2"/><text x="600" y="453" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" letter-spacing="0">π0.7 action model</text><text x="600" y="493" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0">Vision + language → robot motion</text><rect x="56" y="412" width="250" height="103" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="181" y="455" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="0">Observations</text><text x="181" y="489" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">Images + robot state</text><line x1="315" y1="466" x2="352" y2="466" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="412" width="244" height="103" rx="14" fill="#2c3029" stroke="#484d43" stroke-width="2"/><text x="1022" y="455" fill="#e9e4d6" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="0">Robot action</text><text x="1022" y="489" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" letter-spacing="0">Execute and observe</text><line x1="847" y1="466" x2="888" y2="466" stroke="#d7ad57" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1022 527 L 1022 586 L 181 586 L 181 529" fill="none" stroke="#d7ad57" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="630" fill="#d7ad57" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" text-anchor="middle" letter-spacing="0">Subtasks may come from a human coach or a high-level policy.</text><line x1="56" y1="716" x2="1144" y2="716" stroke="#abae9f" stroke-width="1"/><text x="56" y="753" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Conceptual diagram • PCPU</text><text x="56" y="780" fill="#abae9f" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">Simplified context interface; not every experiment uses every conditioning input.</text></svg>